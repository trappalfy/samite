packages:
  - "apps/*"
  - "packages/*"
  - "scripts/mainnet"
allowBuilds:
  esbuild: true
  # Privy's dependency tree: native speed-ups with JS fallbacks, and an install hook we don't need
  "@reown/appkit": false
  bufferutil: false
  keccak: false
  utf-8-validate: false
minimumReleaseAgeExclude:
  - "@aws-sdk/client-s3@3.1167.0"
  - "@aws-sdk/credential-provider-ini@3.973.30"
  - "@aws-sdk/credential-provider-login@3.972.92"
  - "@aws-sdk/credential-provider-node@3.972.97"
  - "@aws-sdk/s3-request-presigner@3.1167.0"
overrides:
  # GHSA-96hv-2xvq-fx4p and GHSA-58qx-3vcg-4xpx: Privy's EVM dependencies pin ws 8.18; 8.21 fixes both and is the same
  # major. The other audit findings under Privy have no fix in a compatible major (docs/SECURITY-REVIEW.md §13).
  "ws@>=8.0.0 <8.21.0": "^8.21.0"
