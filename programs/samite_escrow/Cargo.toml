[package]
name = "samite_escrow"
version = "0.1.0"
description = "Samite escrow: one USDC escrow per job, paid to the machine on acceptance"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "samite_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.2", features = ["event-cpi", "init-if-needed"] }
anchor-spl = { version = "1.2.2", default-features = false, features = ["token", "token_2022", "associated_token", "solana-v3"] }

[dev-dependencies]
litesvm = "0.18.2"
solana-account = "4.3.0"
solana-instruction-error = "2.5.0"
solana-keypair = "3.1.2"
solana-program-option = "3.1.0"
solana-program-pack = "3.1.0"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
solana-transaction-error = "3.4.0"
spl-associated-token-account-interface = "2.0.0"
spl-token-interface = "3.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
