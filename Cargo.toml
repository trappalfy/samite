[workspace]
members = ["programs/*"]
resolver = "2"

[workspace.package]
edition = "2021"
# anchor-lang 1.x MSRV. The SBF build uses the platform-tools Rust; host tests use rust-toolchain.toml.
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
